[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tlm-device-data-platform"
version = "0.0.0"
description = "TLM device data platform"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
server = [
  "httpx==0.28.1",
  "fastapi==0.128.2",
  "uvicorn==0.48.0",
  "psycopg[binary]==3.3.3",
]
test = [
  "playwright==1.63.0",
  "coverage==7.16.1",
  "pytest==9.1.1",
  "fastapi==0.128.2",
  "uvicorn==0.48.0",
  "psycopg[binary]==3.3.3",
  "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
strict = true
testpaths = ["tests"]
markers = ["database: requires a disposable loopback PostgreSQL instance"]

[tool.coverage.run]
branch = true
source = ["tlm_device_data_platform"]

[tool.coverage.report]
show_missing = true

[tool.setuptools.package-data]
tlm_device_data_platform = ["dashboard/*.html", "dashboard/*.css", "dashboard/*.js"]
