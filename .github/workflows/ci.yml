name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install test environment
        run: python -m pip install --constraint requirements/test.txt '.[test]'

      - name: Check dependency consistency
        run: python -m pip check

      - name: Run tests
        run: |
          mkdir -p test-results
          set +e
          python -m pytest --junitxml=test-results/pytest.xml 2>&1 \
            | tee test-results/pytest.log
          pytest_exit_code=${PIPESTATUS[0]}
          set -e
          exit "$pytest_exit_code"

      - name: Validate test result files
        if: ${{ always() }}
        run: |
          missing_results=0
          for result_file in test-results/pytest.xml test-results/pytest.log; do
            if [[ ! -s "$result_file" ]]; then
              echo "::error file=$result_file::Expected test result file is missing or empty"
              missing_results=1
            fi
          done
          exit "$missing_results"

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-results-python-3.11
          path: |
            test-results/pytest.xml
            test-results/pytest.log
          if-no-files-found: error
